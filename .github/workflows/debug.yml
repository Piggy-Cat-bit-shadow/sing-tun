name: debug

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner image
        required: true
        default: ubuntu-latest
      test:
        description: Go test -run regexp
        required: true
        default: TestGoConnKeepalive
      count:
        description: Test count
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Environment
        shell: bash
        run: |
          set -x
          git rev-parse HEAD
          go version
          uname -a
          (ip addr || true) 2>&1 | tee /tmp/network.txt
          (ip route || true) 2>&1 | tee -a /tmp/network.txt
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flags=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq iproute2
            flags="-exec sudo"
          fi
          go test -v -count=${{ inputs.count }} $flags -timeout=20m -run '${{ inputs.test }}' . 2>&1 | tee /tmp/test.log
